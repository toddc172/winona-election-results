name: Update Minnesota election results

on:
  workflow_dispatch:
  schedule:
    # One daily test/update run before and after Election Day.
    - cron: '17 10 * * *'
      timezone: 'America/Chicago'

    # Election Day, Nov. 3: every 15 minutes from 5 a.m. through 6:59 p.m. Central.
    # Offset by 2 minutes to avoid GitHub's busiest top-of-hour scheduling window.
    - cron: '2,17,32,47 5-18 3 11 *'
      timezone: 'America/Chicago'

    # Election night, Nov. 3: every 5 minutes from 7 p.m. through 11:59 p.m. Central.
    - cron: '2-59/5 19-23 3 11 *'
      timezone: 'America/Chicago'

    # Overnight, Nov. 4: every 5 minutes from midnight through 5:59 a.m. Central.
    - cron: '2-59/5 0-5 4 11 *'
      timezone: 'America/Chicago'

    # Post-election morning, Nov. 4: every 15 minutes from 6 a.m. through 11:59 a.m. Central.
    - cron: '2,17,32,47 6-11 4 11 *'
      timezone: 'America/Chicago'

    # Final scheduled midday check on Nov. 4.
    - cron: '2 12 4 11 *'
      timezone: 'America/Chicago'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: winona-election-results-update
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Fetch Minnesota SOS result files
        run: python3 scripts/fetch_results.py

      - name: Commit updated relay file
        shell: bash
        run: |
          if git diff --quiet -- docs/results.json; then
            echo "No relay-file changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/results.json
            git commit -m "Update Minnesota election results"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
