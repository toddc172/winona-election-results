name: Update Minnesota election results

on:
  workflow_dispatch:
  schedule:
# Election Day morning health check.
- cron: '11 10 3 11 *'
  timezone: 'America/Chicago'

# Election-night preflight checks.
- cron: '32,47 19 3 11 *'
  timezone: 'America/Chicago'

# Election night: every 5 minutes from 8 p.m. through 11:59 p.m.
- cron: '2-59/5 20-23 3 11 *'
  timezone: 'America/Chicago'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: winona-election-results-update
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Fetch Minnesota SOS result files
        run: python3 scripts/fetch_results.py

      - name: Commit updated relay file
        shell: bash
        run: |
          if git diff --quiet -- docs/results.json; then
            echo "No relay-file changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/results.json
            git commit -m "Update Minnesota election results"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
