<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Winona election results relay status</title>
<style>
body{font-family:Arial,sans-serif;max-width:760px;margin:40px auto;padding:0 20px;color:#171717}pre{white-space:pre-wrap;background:#f5f5f5;padding:16px;border:1px solid #ddd}a{color:#1756a9}</style>
</head>
<body>
<h1>Winona election results relay</h1>
<p>This GitHub Pages site republishes public 2026 Minnesota Secretary of State election-result files as one browser-readable JSON bundle for the Winona Daily News results module.</p>
<p><a href="results.json">Open results.json</a></p>
<pre id="status">Loading relay status...</pre>
<script>
fetch('results.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{
  const m=d.meta||{};
  document.getElementById('status').textContent=[
    'Generated: '+(m.generatedAt||'not yet run'),
    'Fresh feeds: '+(m.successfulFeeds||0)+' / '+(m.feedCount||15),
    'Cached/stale feeds: '+(m.staleFeeds||0),
    'Unavailable feeds: '+(m.unavailableFeeds||0)
  ].join('\n');
}).catch(e=>document.getElementById('status').textContent='Could not load results.json: '+e.message);
</script>
</body>
</html>
